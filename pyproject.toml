[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evonext"
version = "0.1.0"
description = "OpenCUA-compatible trajectory workbench and evolution control plane"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11.0,<13",
  "fastapi>=0.128,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
  "Jinja2>=3.1.6,<4", "PyYAML>=6.0.2,<7", "filelock>=3.20,<4",
]

[project.optional-dependencies]
infra = [
  "pymongo>=4.13,<5", "minio>=7.2,<8", "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "celery[redis]>=5.6,<6",
]
tracing = ["langfuse>=4.7,<5"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
evonext = "evonext.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires explicitly enabled, isolated external services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
"evonext.evaluation" = ["*.md"]
